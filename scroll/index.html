<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<title>Andreas Nagel — Entwurf</title>
<style>
  :root{--blau:#0018A8;--tinte:#1a1a1a;--grau:#6b7280;--linie:#dfe3ee;--bg:#f0f2f7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--tinte)}
  .karte{width:min(420px,calc(100vw - 40px));background:#fff;border:1px solid var(--linie);
         border-radius:6px;padding:38px 34px;box-shadow:0 18px 50px rgba(0,24,168,.08)}
  .kicker{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blau);
          font-weight:700;margin:0 0 10px}
  h1{font-size:1.35rem;margin:0 0 6px;line-height:1.3}
  p{font-size:.92rem;line-height:1.6;color:var(--grau);margin:0 0 22px}
  label{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;
        color:var(--grau);margin:0 0 7px;font-weight:600}
  input{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--linie);
        border-radius:4px;background:#fbfcfe}
  input:focus{outline:2px solid var(--blau);outline-offset:1px;border-color:var(--blau)}
  button{width:100%;margin-top:14px;padding:12px 14px;font-size:.95rem;font-weight:600;
         color:#fff;background:var(--blau);border:0;border-radius:4px;cursor:pointer}
  button:disabled{opacity:.55;cursor:progress}
  .fehler{color:#b3261e;font-size:.85rem;margin:12px 0 0;min-height:1.2em}
  .fuss{margin:22px 0 0;font-size:.78rem;color:var(--grau)}
</style>
</head>
<body>
<main class="karte" id="tor">
  <p class="kicker">Geschützte Vorschau</p>
  <h1>Entwurfsstand Andreas Nagel</h1>
  <p>Diese Seite ist noch nicht veröffentlicht. Bitte das Passwort eingeben.</p>
  <form id="formular">
    <label for="pw">Passwort</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button type="submit" id="knopf">Vorschau öffnen</button>
    <p class="fehler" id="fehler"></p>
  </form>
  <p class="fuss">Der Inhalt liegt verschlüsselt auf dem Server und ist für Suchmaschinen gesperrt.</p>
</main>

<script>
const SPEICHER = 'nagel-vorschau-pw';
const roh = () => Uint8Array.from(atob(document.getElementById('nutzlast').textContent.trim()), c => c.charCodeAt(0));

async function entschluesseln(passwort){
  const daten = roh();
  const salz = daten.slice(0,16), iv = daten.slice(16,28), chiffre = daten.slice(28);
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(passwort), 'PBKDF2', false, ['deriveKey']);
  const schluessel = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:salz, iterations:300000, hash:'SHA-256'},
    basis, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const klar = await crypto.subtle.decrypt({name:'AES-GCM', iv}, schluessel, chiffre);
  return new TextDecoder().decode(klar);
}

function anzeigen(html){
  document.open(); document.write(html); document.close();
}

async function versuchen(passwort, stillschweigend){
  try{
    const html = await entschluesseln(passwort);
    try{ sessionStorage.setItem(SPEICHER, passwort); }catch(e){}
    anzeigen(html);
    return true;
  }catch(e){
    if(!stillschweigend){
      document.getElementById('fehler').textContent = 'Das Passwort stimmt nicht.';
      document.getElementById('pw').select();
    }
    try{ sessionStorage.removeItem(SPEICHER); }catch(e){}
    return false;
  }
}

document.getElementById('formular').addEventListener('submit', async ev => {
  ev.preventDefault();
  const knopf = document.getElementById('knopf');
  knopf.disabled = true; knopf.textContent = 'Wird entschlüsselt …';
  document.getElementById('fehler').textContent = '';
  const ok = await versuchen(document.getElementById('pw').value, false);
  if(!ok){ knopf.disabled = false; knopf.textContent = 'Vorschau öffnen'; }
});

// Innerhalb einer Sitzung nur einmal fragen
(async () => {
  let gemerkt = null;
  try{ gemerkt = sessionStorage.getItem(SPEICHER); }catch(e){}
  if(gemerkt) await versuchen(gemerkt, true);
})();
</script>
